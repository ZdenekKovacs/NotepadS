# XcodeGen spec. NotepadS.xcodeproj is generated from this file and is NOT committed.
#   Install once:   brew install xcodegen
#   Generate:       xcodegen generate        (re-run after adding/removing files)
name: NotepadS

options:
  bundleIdPrefix: com.example          # TODO: your reverse-DNS prefix
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"               # Swift 6 language mode later (see docs/DESIGN.md)
    # Localization: user-facing strings use String(localized:) and live in String Catalogs
    # (NotepadS/Resources/Localizable.xcstrings). English only for now.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # No paid Apple Developer account yet: sign locally ("Sign to Run Locally", ad-hoc).
    # The app runs on this Mac with the sandbox on, but can't be given to others.
    # When the account exists: set DEVELOPMENT_TEAM, CODE_SIGN_STYLE: Automatic, remove CODE_SIGN_IDENTITY.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"

packages:
  NotepadSCore:
    path: Packages/NotepadSCore

targets:
  NotepadS:
    type: application
    platform: macOS
    sources:
      - path: NotepadS
        excludes:
          - "Help/**"
      # The Help book is a bundle (a folder) and must be copied as one, not file by file.
      - path: NotepadS/Help/NotepadS.help
        type: folder
        buildPhase: resources
      - path: Config
        buildPhase: none               # shown in Xcode, not copied into the app
    dependencies:
      - package: NotepadSCore
    settings:
      base:
        PRODUCT_NAME: NotepadS
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NotepadS   # TODO
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/NotepadS.entitlements
        CODE_SIGN_STYLE: Manual          # ad-hoc signing needs no team (see CODE_SIGN_IDENTITY above)
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        # App icon from NotepadS/Resources/Assets.xcassets (regenerate with scripts/make-app-icon.swift).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  NotepadS:
    build:
      targets:
        NotepadS: all
    run:
      config: Debug
    archive:
      config: Release
